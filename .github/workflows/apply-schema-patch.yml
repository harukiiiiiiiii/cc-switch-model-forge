name: Apply schema patch

on:
  push:
    branches:
      - fix/codex-model-schema-audit
    paths:
      - scripts/apply-schema-patch.cjs
      - model-schema.js
      - app.js
      - catalog-data.js

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply Codex schema patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-model-schema-audit
      - name: Apply deterministic patch
        run: node scripts/apply-schema-patch.cjs
      - name: Verify generated JavaScript
        run: |
          node --check app.js
          node --check catalog-data.js
          node --test tests/model-schema.test.cjs
      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- app.js catalog-data.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js catalog-data.js
          git commit -m "chore: apply Codex schema patch"
          git push origin HEAD:fix/codex-model-schema-audit
