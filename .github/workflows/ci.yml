name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply model template integration
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/model-templates-grok-4-6' }}
        shell: bash
        run: |
          if ! grep -Fq 'const TEMPLATES = window.CC_MODEL_TEMPLATES;' app.js; then
            node scripts/apply-model-template-patch.cjs
          fi

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check model-schema.js
          node --check model-templates.js

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Check required files and references
        shell: bash
        run: |
          test -s index.html
          test -s app.js
          test -s model-schema.js
          test -s model-templates.js
          test -s catalog-data.js
          test -s styles.css
          grep -Fq 'href="styles.css"' index.html
          grep -Fq 'src="catalog-data.js"' index.html
          grep -Fq 'src="model-templates.js"' index.html
          grep -Fq 'src="model-schema.js"' index.html
          grep -Fq 'src="app.js"' index.html

      - name: Smoke test static site
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/model-forge-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              cat /tmp/model-forge-http.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/model-templates.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/model-schema.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/catalog-data.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/styles.css > /dev/null

      - name: Commit model template integration
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/model-templates-grok-4-6' }}
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "chore: apply model template integration"
          git push origin HEAD:feat/model-templates-grok-4-6
